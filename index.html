<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>掲示板 - KaziKi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <input type="checkbox" id="sidebar-toggle" />
  <label for="sidebar-toggle" class="sidebar-toggle-label">
    &#9776;
  </label>

  <h1>Midonatoriの掲示板</h1>
  <p>進捗やメモをまとめて残していくページです。</p>
</header>
  <aside class="sidebar">

      <h2>Midonatoriの掲示板</h2>

    </div>

      <p><a href="https://github.com/Midonatori" target="_blank" rel="noopener">GitHubページ</a></p>

  <main class="main-content">
    <div class="card">
      <h3>進捗 2025-07-06</h3>
      <p>本掲示板を作成。<br>作ったページについて紹介する予定です</p>
    </div>
    <div class="card">
      <h3>進捗 2025-07-07</h3>
      <p>リポジトリを自動反映するシステムを完成。<br>これでリアルタイムにページに行ける。</p>
    </div>
  <div class="card">
      <h3>進捗 2026-09-26</h3>
      <p>本人が久々に復帰<br>こっちの垢も更新</p>
    </div>
  </main>

  <script src="script.js"></script>

</html>
